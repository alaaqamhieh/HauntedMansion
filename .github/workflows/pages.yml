name: Publish to GitHub Pages

# Pages serves the gh-pages branch; this keeps it in sync with development.
on:
  push:
    branches:
      - claude/haunted-house-detective-game-dhdqs8
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force-push this commit to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push -f origin HEAD:gh-pages
